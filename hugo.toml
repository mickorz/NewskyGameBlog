# ============================================================
# 基础配置
# ============================================================
baseURL = "https://mickorz.github.io/NewskyGameBlog/"
languageCode = "zh-cn"
title = "Newsky Game Blog"
theme = "blowfish"  # 修改为 blowfish

# ============================================================
# 内容解析设置
# ============================================================
[markup]
  [markup.goldmark.renderer]
    unsafe = true 
  [markup.highlight]
    noClasses = false
    style = "monokai"

# ============================================================
# Blowfish 全局参数配置
# ============================================================
[params]
  env = "production"
  description = "游戏技术分享 | Animancer 中文文档 | Unity 开发笔记"
  
  
  # 界面外观设置
  defaultAppearance = "dark"      # 默认深色模式
  autoSwitchAppearance = true     # 自动切换
  colorScheme = "blowfish"        # 配色方案
  
  # 布局宽度：改为 xl 或 wide 实现宽屏
  layoutWidth = "wide" 
  
  # 禁止 SEO 爬虫
  robots = "noindex, nofollow"


    # 作者
  [params.author]
    name = "mickorz"
    image = "" # 如果没有头像，可以暂时留空 ""
    headline = "游戏开发者 / 技术博主"
    bio = "专注于 Unity 开发与 Animancer 插件深度解析"
    links = [
        { github = "https://github.com/mickorz" },
        # { twitter = "https://twitter.com/..." },
    ]

  # 搜索配置
  [params.search]
    showSearch = true
    showSearchKeys = true

  # 文章内部功能
  [params.article]
    showTableOfContents = true    # 显示 TOC
    showRelatedPosts = true       # 显示相关文章
    showReadingTime = true
    showLinksContext = true       # 显示上下文链接

  # 头部/导航栏配置 (Blowfish 专用)
  [params.header]
    layout = "basic"              # 可选: "basic", "fixed", "stacked"
    showSearch = true

  # 首页欢迎语 (Blowfish 替代 HomeInfo 的方式)
  [params.hero]
    showHero = true
    heroSize = "default"
    image = ""                    # 可以放一张 Unity 相关的背景图
    title = "Newsky Game Blog 🎮"
    subtitle = "专注于 Unity 动画系统 Animancer 的深度探索"
    content = """
👉 **[立即进入：Animancer 中文索引](/animancer/)**

这里有超过 50 篇详细的实战笔记，涵盖 IK 系统、FSM 状态机及动画混合技巧。
"""

# ============================================================
# 菜单配置 - 链接不再需要手动加仓库名后缀
# ============================================================
[[menu.main]]
    identifier = "animancer"
    name = "📚 Animancer 文档"
    url = "/animancer/"
    weight = 1

[[menu.main]]
    identifier = "posts"
    name = "所有文章"
    url = "/posts/"
    weight = 2

[[menu.main]]
    identifier = "github"
    pre = "github" # Blowfish 支持图标
    url = "https://github.com/mickorz"
    weight = 3

# ============================================================
# 输出配置
# ============================================================
[outputs]
  home = ["HTML", "RSS", "JSON"]