# ============================================================
# 基础配置 - 解决 404 和 样式丢失的关键
# ============================================================
# 必须以 https 开头，以 / 结尾。大小写必须与 GitHub 仓库名一致
baseURL = "https://mickorz.github.io/NewskyGameBlog/"
languageCode = "zh-cn"
title = "Newsky Game Blog"
theme = "PaperMod"

# ============================================================
# 内容解析设置 - 提高对 Markdown 的兼容性
# ============================================================
[markup]
  [markup.goldmark.renderer]
    unsafe = true  # 允许在 Markdown 中写 HTML（比如调整图片大小）
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true          # 显示行号
    style = "monokai"       # 程序员最爱的深色代码主题
    noClasses = false       # 配合主题样式

# ============================================================
# 页面参数配置 (针对 PaperMod 主题)
# ============================================================
[params]
  env = "production"
  title = "Newsky Game Blog"
  description = "游戏技术分享 | Animancer 中文文档 | Unity 开发笔记"
  keywords = ["Unity", "Game Dev", "Animancer", "C#", "Shader"]
  author = "mickorz"
  
  # 显示文章目录 (TOC)
  ShowToc = true
  TocOpen = true # 默认展开目录
  
  # 搜索功能支持 (需要 PaperMod 主题)
  ShowSearchResults = true

  # 界面细节
  defaultTheme = "auto" # 自动跟随系统深色/浅色模式
  disableThemeToggle = false
  ShowShareButtons = true
  ShowReadingTime = true
  ShowBreadCrumbs = true # 显示面包屑导航
  ShowPostNavLinks = true # 显示上一篇/下一篇文章跳转

  # 社交链接 (可选)
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/mickorz"

# ============================================================
# 菜单配置
# ============================================================
[[menu.main]]
    identifier = "animancer"
    name = "📚 Animancer 中文文档"
    url = "/Animancer/" # 这里的路径对应 content/Animancer/ 文件夹
    weight = 1
	
[[menu.main]]
  identifier = "posts"
  name = "所有文章"
  url = "/posts/"
  weight = 2

# ============================================================
# 首页欢迎语配置 - 这里的链接能实现“快速进入”
# ============================================================
[params.homeInfoParams]
    Title = "Newsky Game Blog 🎮"
    Content = """
欢迎！这里专注于游戏技术分享，尤其是 **Unity 动画系统** 的深度探索。

👉 **[立即进入：Animancer 中文索引](/Animancer/)**

这里有超过 50 篇详细的翻译与实战笔记，涵盖：
- [核心功能与 IK 系统](/Animancer/animancer_ik官方文档/)
- [FSM 状态机管理](/Animancer/fsm/animancer_fsm官方文档/)
- [动画混合与 Layer 技巧](/Animancer/blend/animancer_blending官方文档/)
"""

# ============================================================
# 主题通用参数
# ============================================================
[params]
    env = "production"
    # 开启目录
    ShowToc = true
    TocOpen = true
    # 允许在首页显示描述
    showDescription = true
    # 搜索功能
    ShowSearchResults = true


# ============================================================
# 输出配置 - 支持搜索索引
# ============================================================
[outputs]
  home = ["HTML", "RSS", "JSON"]