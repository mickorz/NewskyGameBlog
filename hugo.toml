# ============================================================
# 基础配置
# ============================================================
baseURL = "https://mickorz.github.io/NewskyGameBlog/"
languageCode = "zh-cn"
title = "Newsky Game Blog"
theme = "blowfish"


[taxonomies]
category = "categories"
tag = "tags"
series = "series" # 如果你想自定义其他的分类方式

# ============================================================
# 内容解析设置
# ============================================================
[markup]
  [markup.goldmark.renderer]
    unsafe = true 
  [markup.highlight]
    noClasses = false
    style = "monokai"

# ============================================================
# Blowfish 全局参数配置
# ============================================================
[params]
  env = "production"
  description = "游戏技术分享 | Animancer 中文文档 | Unity 开发笔记"
  
  defaultAppearance = "dark"
  autoSwitchAppearance = true
  colorScheme = "blowfish"
  
  robots = "no_index, nofollow"
  customCSS = ["css/custom.css"]

  # 首页显示的文件夹
  mainSections = ["posts", "animancer", "gspawn", "kinematiccharactercontroller", "blazeaiengine"]

  [params.author]
    name = "逸空"
    headline = "游戏开发者 / 技术博主"
    bio = "专注于 Unity 开发与 Animancer 插件深度解析"
    links = [{ github = "https://github.com/mickorz" }]

  [params.search]
    showSearch = true
    showSearchKeys = true

  [params.article]
    showTableOfContents = true
    showRelatedPosts = true
    showReadingTime = true
    showLinksContext = true

  [params.homepage]
    layout = "background"
    showRecent = true
    showRecentItems = 10
    cardViewScreenWidth = false

  [params.header]
    layout = "basic"
    showSearch = true

  [params.hero]
    showHero = true
    heroSize = "small"
    title = "Newsky Game Blog 🎮"
    subtitle = "专注于 Unity 动画系统 Animancer 的深度探索"
    content = """
👉 **[立即进入：Animancer 中文索引](/animancer/)**

这里有超过 50 篇详细的实战笔记，涵盖 IK 系统、FSM 状态机及动画混合技巧。"""

# ============================================================
# 菜单配置
# ============================================================

[[menu.main]]
    identifier = "Slate"
    name = "Slate 文档"
    url = "/Slate/"
    weight = 100

[[menu.main]]
    identifier = "GSpawn"
    name = "GSpawn 文档"
    url = "/GSpawn/"
    weight = 101

[[menu.main]]
    identifier = "animancer"
    name = "Animancer 文档"
    url = "/animancer/"
    weight = 102

